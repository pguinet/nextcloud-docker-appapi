# Reglages Coraza propres a cette stack.
# Charge apres coraza.conf-recommended et avant le CRS : les directives
# ci-dessous l'emportent sur les valeurs recommandees.
# Monte en lecture seule : un "caddy reload" suffit apres modification.

# Mode bloquant
SecRuleEngine On

# Pas d'inspection des reponses : couteux, et sans interet pour des fichiers
SecResponseBodyAccess Off

# Pas de journal d'audit fichier (non rotatif) : les regles declenchees
# apparaissent deja dans les logs du conteneur Caddy.
SecAuditEngine Off

# Corps des uploads WebDAV non inspectes : ce sont des fichiers (jusqu'a
# PHP_UPLOAD_LIMIT), sans interet pour le CRS et qu'il faudrait sinon mettre
# en tampon. L'URL et les en-tetes restent analyses.
SecRule REQUEST_METHOD "@pm PUT POST" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:remote|public)\.php/(?:webdav/|dav/(?:bulk|files/|uploads/))" \
        "ctl:requestBodyAccess=Off"

# Exclusions locales (faux positifs constates) : ajouter ici, avec un id
# entre 10002 et 19999 et un commentaire expliquant le cas.

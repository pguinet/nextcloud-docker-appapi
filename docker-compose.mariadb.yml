services:
  # ===========================================
  # Reverse Proxy - SSL automatique
  # ===========================================
  caddy:
    image: caddy:2-alpine
    container_name: nextcloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - NEXTCLOUD_DOMAIN=${NEXTCLOUD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    depends_on:
      - nextcloud

  # ===========================================
  # Nextcloud - Application principale
  # ===========================================
  nextcloud:
    #image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
    #pull_policy: always
    build: ./
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      appapi-harp:
        condition: service_started
    environment:
      # Base de données MySQL/MariaDB
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      # Redis
      - REDIS_HOST=redis

      # Configuration Nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN}
      - TRUSTED_PROXIES=172.19.0.0/16
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}

      # Admin initial (ignoré si config.php existe déjà)
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

      # PHP
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1G}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-10G}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
    networks:
      - frontend
      - backend

  # ===========================================
  # MariaDB - Base de données
  # ===========================================
  db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped
    # --slave-connections-needed-for-purge=0 : sans ce reglage, MariaDB 11.4+ refuse de purger
    # les binlogs tant qu'aucun replica ne les a consommes, et ils s'accumulent indefiniment
    # malgre expire_logs_days. Ce serveur est standalone : aucun replica n'existe.
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW --log-bin-trust-function-creators=1 --slave-connections-needed-for-purge=0
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DATA_PATH:-./data}/db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis - Cache et File Locking
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${DATA_PATH:-./data}/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Cron - Tâches planifiées
  # ===========================================
  cron:
      #image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
      build: ./
      container_name: nextcloud-cron
      restart: unless-stopped
      # Sans cet utilisateur, le script tourne en root : Nextcloud refuse alors de
      # s'initialiser ("File sequence directory exists but is not writable") et
      # preview:pre-generate ecrirait des fichiers root dans les donnees.
      user: www-data
      depends_on:
        - nextcloud
      entrypoint: /bin/bash
      command: /custom-hooks/cron-custom.sh
      volumes:
        - nextcloud_html:/var/www/html
        - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
        - ./hooks:/custom-hooks
      networks:
        - backend

  # ===========================================
  # HaRP - Reverse Proxy AppAPI haute performance
  # ===========================================
  # Proxy les requêtes ExApps directement (sans passer par PHP)
  # Gère le tunnel FRP pour les conteneurs ExApp
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: nextcloud-appapi-harp
    restart: unless-stopped
    environment:
      - HP_SHARED_KEY=${HARP_SHARED_KEY}
      - NC_INSTANCE_URL=http://nextcloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

# ===========================================
# Volumes
# ===========================================
volumes:
  nextcloud_html:
    name: nextcloud_html
  caddy_data:
    name: nextcloud_caddy_data
  caddy_config:
    name: nextcloud_caddy_config

# ===========================================
# Réseaux
# ===========================================
networks:
  frontend:
    name: nextcloud_frontend
  backend:
    name: nextcloud_backend

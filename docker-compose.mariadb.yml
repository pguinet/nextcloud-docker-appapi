services:
  # ===========================================
  # Reverse Proxy - SSL automatique + WAF Coraza
  # ===========================================
  caddy:
    build: ./caddy
    image: nextcloud-caddy-waf
    container_name: nextcloud-caddy
    restart: unless-stopped
    # Le WAF journalise chaque regle declenchee : plafonner les logs Docker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - NEXTCLOUD_DOMAIN=${NEXTCLOUD_DOMAIN}
      # IP/plages autorisees, separees par des espaces (voir .env.example)
      - NEXTCLOUD_ALLOWED_IPS=${NEXTCLOUD_ALLOWED_IPS:-}
      # Seuls les conteneurs du reseau backend sont autorises d'office
      - NEXTCLOUD_BACKEND_SUBNET=${NEXTCLOUD_BACKEND_SUBNET:-172.18.0.0/16}
      - NEXTCLOUD_BACKEND_GATEWAY=${NEXTCLOUD_BACKEND_GATEWAY:-172.18.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/coraza:/etc/caddy/coraza:ro
      - ./caddy/uptimerobot-ips.caddy:/etc/caddy/uptimerobot-ips.caddy:ro
      # Sites additionnels propres a l'hote, importes par le Caddyfile
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        # Reseau de sortie prioritaire : les ports publies arrivent par lui,
        # en IPv4 comme en IPv6, avec la vraie IP du client.
        gw_priority: 1
      backend:
        # Les conteneurs qui appellent l'URL publique (Nextcloud, ExApps)
        # joignent Caddy directement, sans repasser par l'IP publique.
        aliases:
          - ${NEXTCLOUD_DOMAIN}
    depends_on:
      - nextcloud

  # ===========================================
  # Nextcloud - Application principale
  # ===========================================
  nextcloud:
    #image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
    #pull_policy: always
    build: ./
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      appapi-harp:
        condition: service_started
    environment:
      # Base de données MySQL/MariaDB
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      # Redis
      - REDIS_HOST=redis

      # Configuration Nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN}
      - TRUSTED_PROXIES=172.19.0.0/16
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}

      # Admin initial (ignoré si config.php existe déjà)
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

      # PHP
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1G}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-10G}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
    networks:
      - frontend
      - backend

  # ===========================================
  # MariaDB - Base de données
  # ===========================================
  db:
    # Docker Hardened Image : tourne en nonroot (uid 65532), cf. scripts/prepare-data-dirs.sh.
    # Son entrypoint differe de l'image officielle : il ignore les arguments de command
    # (options a passer dans MARIADB_OPTIONS) et ne cree ni base ni utilisateur
    # (cf. scripts/init-mariadb.sh).
    image: dhi.io/mariadb:11.8
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      # Lus par scripts/init-mariadb.sh, pas par l'image
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # --slave-connections-needed-for-purge=0 : sans ce reglage, MariaDB 11.4+ refuse de purger
      # les binlogs tant qu'aucun replica ne les a consommes, et ils s'accumulent indefiniment
      # malgre expire_logs_days. Ce serveur est standalone : aucun replica n'existe.
      # --innodb-buffer-pool-size : 1 Go recommande par occ db:info (128 Mo par defaut).
      # A reduire via MARIADB_BUFFER_POOL_SIZE sur une machine avec peu de RAM.
      # --innodb-log-file-size : au moins 128 Mo pour les setupchecks (96 Mo par defaut) ;
      # MariaDB redimensionne le journal existant au demarrage.
      - MARIADB_OPTIONS=--transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW --log-bin-trust-function-creators=1 --slave-connections-needed-for-purge=0 --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL_SIZE:-1G} --innodb-log-file-size=256M
    volumes:
      - ${DATA_PATH:-./data}/db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      # Sans --innodb_initialized : il exige les identifiants de .my-healthcheck.cnf, que
      # seule l'image officielle cree. Le serveur DHI n'ecoute qu'apres l'init d'InnoDB.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis - Cache et File Locking
  # ===========================================
  redis:
    # Docker Hardened Image : tourne en nonroot (uid 65532), cf. scripts/prepare-data-dirs.sh
    image: dhi.io/redis:7
    container_name: nextcloud-redis
    restart: unless-stopped
    # --protected-mode no : l'entrypoint de l'image officielle l'ajoutait de lui-meme ; sans lui,
    # Redis refuse tout client hors loopback. Sans danger : redis n'est que sur le reseau backend.
    command: redis-server --save 60 1 --loglevel warning --protected-mode no
    volumes:
      - ${DATA_PATH:-./data}/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Cron - Tâches planifiées
  # ===========================================
  cron:
      #image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
      build: ./
      container_name: nextcloud-cron
      restart: unless-stopped
      # Sans cet utilisateur, le script tourne en root : Nextcloud refuse alors de
      # s'initialiser ("File sequence directory exists but is not writable") et
      # preview:pre-generate ecrirait des fichiers root dans les donnees.
      user: www-data
      depends_on:
        - nextcloud
      entrypoint: /bin/bash
      command: /custom-hooks/cron-custom.sh
      volumes:
        - nextcloud_html:/var/www/html
        - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
        - ./hooks:/custom-hooks
      networks:
        - backend

  # ===========================================
  # HaRP - Reverse Proxy AppAPI haute performance
  # ===========================================
  # Proxy les requêtes ExApps directement (sans passer par PHP)
  # Gère le tunnel FRP pour les conteneurs ExApp
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: nextcloud-appapi-harp
    restart: unless-stopped
    environment:
      - HP_SHARED_KEY=${HARP_SHARED_KEY}
      - NC_INSTANCE_URL=http://nextcloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

# ===========================================
# Volumes
# ===========================================
volumes:
  nextcloud_html:
    name: nextcloud_html
  caddy_data:
    name: nextcloud_caddy_data
  caddy_config:
    name: nextcloud_caddy_config

# ===========================================
# Réseaux
# ===========================================
networks:
  frontend:
    name: nextcloud_frontend
    # Sans IPv6 sur ce reseau, les clients IPv6 passent par docker-proxy et
    # Caddy ne voit que l'IP de la passerelle : le filtre IP serait faux.
    enable_ipv6: true
  backend:
    name: nextcloud_backend
    # Sous-reseau fixe : le filtre IP de Caddy l'autorise explicitement
    ipam:
      config:
        - subnet: ${NEXTCLOUD_BACKEND_SUBNET:-172.18.0.0/16}
          gateway: ${NEXTCLOUD_BACKEND_GATEWAY:-172.18.0.1}

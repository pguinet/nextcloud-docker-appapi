services:
  # ===========================================
  # Reverse Proxy - SSL automatique + WAF Coraza
  # ===========================================
  caddy:
    build: ./caddy
    image: nextcloud-caddy-waf
    container_name: nextcloud-caddy
    restart: unless-stopped
    # Le WAF journalise chaque regle declenchee : plafonner les logs Docker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - NEXTCLOUD_DOMAIN=${NEXTCLOUD_DOMAIN}
      # IP/plages autorisees, separees par des espaces (voir .env.example)
      - NEXTCLOUD_ALLOWED_IPS=${NEXTCLOUD_ALLOWED_IPS:-}
      # Seuls les conteneurs du reseau backend sont autorises d'office
      - NEXTCLOUD_BACKEND_SUBNET=${NEXTCLOUD_BACKEND_SUBNET:-172.18.0.0/16}
      - NEXTCLOUD_BACKEND_GATEWAY=${NEXTCLOUD_BACKEND_GATEWAY:-172.18.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/coraza:/etc/caddy/coraza:ro
      - ./caddy/uptimerobot-ips.caddy:/etc/caddy/uptimerobot-ips.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        # Reseau de sortie prioritaire : les ports publies arrivent par lui,
        # en IPv4 comme en IPv6, avec la vraie IP du client.
        gw_priority: 1
      backend:
        # Les conteneurs qui appellent l'URL publique (Nextcloud, ExApps)
        # joignent Caddy directement, sans repasser par l'IP publique.
        aliases:
          - ${NEXTCLOUD_DOMAIN}
    depends_on:
      - nextcloud

  # ===========================================
  # Nextcloud - Application principale
  # ===========================================
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      appapi-harp:
        condition: service_started
    environment:
      # Base de données
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      # Redis
      - REDIS_HOST=redis
      
      # Configuration Nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN}
      - TRUSTED_PROXIES=172.19.0.0/16
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}
      
      # Admin initial
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      
      # PHP
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1G}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-10G}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
    networks:
      - frontend
      - backend

  # ===========================================
  # PostgreSQL - Base de données
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH:-./data}/db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis - Cache et File Locking
  # ===========================================
  redis:
    # Docker Hardened Image : tourne en nonroot (uid 65532), cf. scripts/prepare-data-dirs.sh
    image: dhi.io/redis:7
    container_name: nextcloud-redis
    restart: unless-stopped
    # --protected-mode no : l'entrypoint de l'image officielle l'ajoutait de lui-meme ; sans lui,
    # Redis refuse tout client hors loopback. Sans danger : redis n'est que sur le reseau backend.
    command: redis-server --save 60 1 --loglevel warning --protected-mode no
    volumes:
      - ${DATA_PATH:-./data}/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Cron - Tâches planifiées
  # ===========================================
  cron:
    image: nextcloud:${NEXTCLOUD_VERSION:-32}-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    depends_on:
      - nextcloud
    entrypoint: /cron.sh
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_PATH:-./data}/nextcloud:/var/www/html/data
    networks:
      - backend

  # ===========================================
  # HaRP - Reverse Proxy AppAPI haute performance
  # ===========================================
  # Proxy les requêtes ExApps directement (sans passer par PHP)
  # Gère le tunnel FRP pour les conteneurs ExApp
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: nextcloud-appapi-harp
    restart: unless-stopped
    environment:
      - HP_SHARED_KEY=${HARP_SHARED_KEY}
      - NC_INSTANCE_URL=http://nextcloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

# ===========================================
# Volumes
# ===========================================
volumes:
  nextcloud_html:
    name: nextcloud_html
  caddy_data:
    name: nextcloud_caddy_data
  caddy_config:
    name: nextcloud_caddy_config

# ===========================================
# Réseaux
# ===========================================
networks:
  frontend:
    name: nextcloud_frontend
    # Sans IPv6 sur ce reseau, les clients IPv6 passent par docker-proxy et
    # Caddy ne voit que l'IP de la passerelle : le filtre IP serait faux.
    enable_ipv6: true
  backend:
    name: nextcloud_backend
    # Sous-reseau fixe : le filtre IP de Caddy l'autorise explicitement
    ipam:
      config:
        - subnet: ${NEXTCLOUD_BACKEND_SUBNET:-172.18.0.0/16}
          gateway: ${NEXTCLOUD_BACKEND_GATEWAY:-172.18.0.1}
